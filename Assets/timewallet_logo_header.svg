<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',Arial,sans-serif">
  <!-- fundo transparente: pensado para ficar sobre o verde #4A701C do header -->

  <!-- ICON (sem o container quadrado, pois o fundo já é o verde) -->
  <g transform="translate(18,28) scale(1.08)">
    <!-- aba da carteira -->
    <rect x="17" y="21" width="62" height="20" rx="7" fill="#EFF1EA" opacity="0.55"/>
    <!-- corpo da carteira -->
    <rect x="16" y="29" width="64" height="46" rx="9" fill="#F7F5EE"/>
    <rect x="16" y="29" width="64" height="46" rx="9" fill="none" stroke="#375215" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- detalhe do bolso do cartão -->
    <line x1="24" y1="65" x2="48" y2="65" stroke="#7A8570" stroke-width="2" stroke-linecap="round"/>
    <!-- selo do relógio -->
    <circle cx="66" cy="51" r="15.5" fill="#B9A47C" stroke="#375215" stroke-width="2"/>
    <circle cx="66" cy="51" r="1.8" fill="#20291A"/>
    <line x1="66" y1="51" x2="66" y2="43" stroke="#20291A" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="66" y1="51" x2="72.5" y2="51" stroke="#20291A" stroke-width="2.3" stroke-linecap="round"/>
  </g>

  <!-- WORDMARK claro para contraste sobre o verde -->
  <text x="152" y="88" font-size="46" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#F7F5EE">Time</tspan><tspan fill="#C9B589">Wallet</tspan>
  </text>

  <!-- underline accent -->
  <rect x="154" y="100" width="64" height="4" rx="2" fill="#C9B589"/>

  <!-- tagline -->
  <text x="154" y="126" font-size="14" letter-spacing="3" fill="#E8F0DD" font-weight="500" opacity="0.85">BANCO DE HORAS</text>
</svg>
