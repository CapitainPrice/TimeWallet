<svg width="192" height="192" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A701C"/>
      <stop offset="1" stop-color="#375215"/>
    </linearGradient>
  </defs>

  <!-- container -->
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#bgGrad)"/>

  <!-- wallet flap peeking from behind -->
  <rect x="17" y="21" width="62" height="20" rx="7" fill="#EFF1EA" opacity="0.55"/>

  <!-- wallet body -->
  <rect x="16" y="29" width="64" height="46" rx="9" fill="#F7F5EE"/>
  <rect x="16" y="29" width="64" height="46" rx="9" fill="none" stroke="#375215" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- card slot detail -->
  <line x1="24" y1="65" x2="48" y2="65" stroke="#7A8570" stroke-width="2" stroke-linecap="round"/>

  <!-- clock badge -->
  <circle cx="66" cy="51" r="15.5" fill="#B9A47C" stroke="#375215" stroke-width="2"/>
  <circle cx="66" cy="51" r="1.8" fill="#20291A"/>
  <line x1="66" y1="51" x2="66" y2="43" stroke="#20291A" stroke-width="2.3" stroke-linecap="round"/>
  <line x1="66" y1="51" x2="72.5" y2="51" stroke="#20291A" stroke-width="2.3" stroke-linecap="round"/>
</svg>
