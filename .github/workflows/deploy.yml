name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create config.js from secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const raw = process.env.FIREBASE_CONFIG;
          if (!raw) {
            throw new Error('Missing FIREBASE_CONFIG secret');
          }

          const config = JSON.parse(raw);
          const noWhitespaceKeys = [
            'apiKey',
            'authDomain',
            'projectId',
            'storageBucket',
            'messagingSenderId',
            'appId',
          ];

          noWhitespaceKeys.forEach((key) => {
            if (typeof config[key] === 'string') {
              config[key] = config[key].replace(/\s+/g, '');
            }
          });

          const missingKeys = noWhitespaceKeys.filter((key) => !config[key]);
          if (missingKeys.length > 0) {
            throw new Error(`Invalid FIREBASE_CONFIG secret. Missing: ${missingKeys.join(', ')}`);
          }

          fs.writeFileSync('config.js', `window.FIREBASE_CONFIG = ${JSON.stringify(config)};\n`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4