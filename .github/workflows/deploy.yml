name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create config.js from secret
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const raw = process.env.FIREBASE_CONFIG;
          if (!raw) {
            throw new Error('Missing FIREBASE_CONFIG secret');
          }

          function parseFirebaseConfig(value) {
            try {
              return JSON.parse(value);
            } catch {}

            const sandbox = { window: {} };
            try {
              vm.runInNewContext(value, sandbox);
            } catch {}

            if (sandbox.window?.FIREBASE_CONFIG && typeof sandbox.window.FIREBASE_CONFIG === 'object') {
              return sandbox.window.FIREBASE_CONFIG;
            }
            if (sandbox.firebaseConfig && typeof sandbox.firebaseConfig === 'object') {
              return sandbox.firebaseConfig;
            }

            const objectMatch = String(value).trim().match(/\{[\s\S]*\}/);
            if (!objectMatch) {
              throw new Error('Invalid FIREBASE_CONFIG secret. Expected JSON object or Firebase config snippet.');
            }

            return vm.runInNewContext(`(${objectMatch[0]})`);
          }

          const config = parseFirebaseConfig(raw);
          const noWhitespaceKeys = [
            'apiKey',
            'authDomain',
            'projectId',
            'storageBucket',
            'messagingSenderId',
            'appId',
          ];

          noWhitespaceKeys.forEach((key) => {
            if (typeof config[key] === 'string') {
              config[key] = config[key].replace(/\s+/g, '');
            }
          });

          const missingKeys = noWhitespaceKeys.filter((key) => !config[key]);
          if (missingKeys.length > 0) {
            throw new Error(`Invalid FIREBASE_CONFIG secret. Missing: ${missingKeys.join(', ')}`);
          }

          fs.writeFileSync('config.js', `window.FIREBASE_CONFIG = ${JSON.stringify(config)};\n`);
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4