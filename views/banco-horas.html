<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Banco de Horas - TimeWallet</title>
  <link rel="icon" type="image/svg+xml" href="../assets/timewallet_icon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../config.js"></script>
</head>
<body data-view="registro" data-root="..">
  <div class="app">
    <div class="top-bar">
      <a class="app-logo" href="../index.html" aria-label="Ir para tela inicial">
        <img src="../assets/timewallet_logo_header.svg" alt="TimeWallet">
      </a>
    </div>

    <div class="sub-header">
      <div class="sub-header-left">
        <button class="sub-header-cal" id="primaryNavBtn" type="button" aria-label="Ir para tela inicial">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <span class="sub-header-date" id="dataPrincipal">—</span>
      </div>
      <div class="user-menu" id="userMenu">
        <button class="user-btn" id="btnUsuario" type="button" aria-label="Usuário" aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <div class="user-dropdown" id="userDropdown" role="menu" hidden>
          <div class="dropdown-header" id="dropdownHeader"></div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="dropdownSignIn" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Entrar com Google</span>
          </button>
          <button class="dropdown-item" id="dropdownSignOut" role="menuitem" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span>Sair</span>
          </button>
        </div>
      </div>
    </div>

    <main class="page-view">
      <div class="hero-greeting">
        <span class="hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
        </span>
        <h1 class="hero-title">Banco de Horas</h1>
      </div>
      <div class="cal-heading-date" id="registroPeriodo">—</div>

      <div class="detail-hero hero-muted" id="registroHero" style="margin-top:24px;">
        <div class="dh-label">Saldo atual</div>
        <div class="dh-value" id="registroSaldo">0min</div>
      </div>

      <div class="reg-summary-grid" style="margin-top:16px;">
        <div class="reg-summary-item">
          <span>Registros</span>
          <strong id="registroCount">0</strong>
        </div>
        <div class="reg-summary-item">
          <span>Extras</span>
          <strong id="registroCountPositivos">0</strong>
        </div>
        <div class="reg-summary-item">
          <span>Descontos</span>
          <strong id="registroCountNegativos">0</strong>
        </div>
      </div>

      <div class="cal-card reg-card" style="margin-top:24px;">
        <div class="period-label period-label-centered">Período</div>
        <div class="cal-nav">
          <button id="regPrevPeriod">‹</button>
          <div class="month" id="regPeriodoLabel">—</div>
          <button id="regNextPeriod">›</button>
        </div>
        <div class="reg-header">
          <span class="col-dia">Dia</span>
          <span class="col-ponto">Ponto</span>
          <span class="col-saida">Saída</span>
          <span class="col-local">Localização</span>
          <span class="col-horas">Saldo</span>
        </div>
        <div class="reg-tabela" id="regTabela"></div>
        <div class="reg-paginacao" id="regPaginacao"></div>
      </div>

    </main>

    <div class="app-footer">Desenvolvido por Guilherme Gonçalves.</div>
    <div class="toast" id="toast">Salvo!</div>
  </div>

  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/banco-horas.js"></script>
</body>
</html>
