<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TimeWallet - Banco de Horas</title>
<link rel="icon" type="image/svg+xml" href="assets/timewallet_icon.svg">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
</head>
<body data-view="home" data-root=".">
<div class="app">
  <div class="top-bar">
    <a class="app-logo" href="index.html" aria-label="Ir para tela inicial">
      <img src="assets/timewallet_logo_header.svg" alt="TimeWallet">
    </a>
  </div>

  <div class="sub-header">
    <div class="sub-header-left">
      <button class="sub-header-cal" id="primaryNavBtn" type="button" aria-label="Abrir calendário">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </button>
      <span class="sub-header-date" id="dataPrincipal">—</span>
    </div>
    <div class="user-menu" id="userMenu">
      <button class="user-btn" id="btnUsuario" type="button" aria-label="Usuário" aria-expanded="false" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
      <div class="user-dropdown" id="userDropdown" role="menu" hidden>
        <div class="dropdown-header" id="dropdownHeader"></div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" id="dropdownSignIn" role="menuitem" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span>Entrar com Google</span>
        </button>
        <button class="dropdown-item" id="dropdownSignOut" role="menuitem" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>

  <main class="hero-wrap">
    <div class="hero-greeting">
      <span class="hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"></path></svg>
      </span>
      <h1 class="hero-title" id="saudacaoPrincipal">—</h1>
    </div>

    <div class="hero-card">
      <input type="hidden" id="saida">
      <div class="file-drop" id="fileDrop">
        <div class="ph" id="filePh">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <span>Nenhum registro de saída hoje ainda</span>
        </div>
        <div class="done-status" id="doneStatus" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12.5l2.5 2.5L16 9"></path></svg>
          <span>Registro realizado</span>
        </div>
        <div class="detail-hero hero-muted" id="resultBox" style="margin-top:20px;">
          <div class="dh-label" id="tempoExtraLabel">Tempo extra</div>
          <div class="dh-value" id="tempoExtra">—</div>
          <div style="font-size:12px;opacity:.85;margin-top:6px;" id="horarioCapturado">Aguardando registro de hoje</div>
          <div class="hero-meta" id="comprovanteMeta" hidden style="grid-template-columns:1fr;">
            <div class="hero-meta-item">
              <span class="hero-meta-label">Localização obtida</span>
              <strong class="hero-meta-value" id="comprovantePeriodo">—</strong>
            </div>
          </div>
        </div>
        <div class="geo-status" id="geoStatus" style="display:none;"></div>
        <input type="file" id="comprovanteCamera" accept="image/*" capture="environment" hidden>
      </div>

      <div class="hero-card-bottom">
        <button type="button" class="hero-card-tag" id="btnRegistro">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg>
          Banco de Horas
        </button>
        <button type="button" class="hero-cam-btn" id="btnCamera" aria-label="Tirar foto">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>
      </div>
    </div>
  </main>

  <div class="app-footer">Desenvolvido por Guilherme Gonçalves.</div>
  <div class="toast" id="toast">Salvo!</div>

  <div class="cam-modal" id="camModal">
    <video id="camVideo" autoplay playsinline muted></video>
    <img id="camPreview" style="display:none;">
    <div class="cam-question" id="camQuestion" style="display:none;">Foto ficou boa?</div>
    <div class="cam-actions" id="camActionsLive">
      <button class="fa-btn cam-cancel" id="camCancelar" type="button">Cancelar</button>
      <button class="btn" id="camCapturar" type="button" style="margin-top:0;">Capturar foto</button>
    </div>
    <div class="cam-actions" id="camActionsPreview" style="display:none;">
      <button class="fa-btn cam-cancel" id="camMudar" type="button">Mudar</button>
      <button class="btn" id="camFeito" type="button" style="margin-top:0;">Feito!</button>
    </div>
  </div>
  <canvas id="camCanvas" style="display:none;"></canvas>

  <div class="img-modal" id="imgModal">
    <button class="icon-btn" id="closeImgModal">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="imgModalPic" alt="Comprovante">
  </div>
</div>

<script src="assets/js/shared.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
